# HybridChain weekly audit (slow checks, also runnable by hand from the Actions tab).
#   static     SpotBugs + FindSecBugs (profile audit-static; reports, does not fail the run)
#   mutation   PIT mutation testing on the security-critical core (profile audit-pit, pit.target)
#   audit-poc  the audit proof-of-concept suite: each PoC asserts the CORRECT behaviour, so a
#              failure means a fixed audit finding has come back
name: Weekly audit

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: blockchain-java

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -Paudit-static -DskipTests compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs
          path: blockchain-java/target/spotbugsXml.xml
          if-no-files-found: warn

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -Paudit-pit test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-reports
          path: blockchain-java/target/pit-reports/
          if-no-files-found: warn

  audit-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp test -Dtest=HybridChainAuditPoCTest -Daudit.excluded=none -Djacoco.skip=true -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-poc-reports
          path: blockchain-java/target/surefire-reports/
          if-no-files-found: ignore
